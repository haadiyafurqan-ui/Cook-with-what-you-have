<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>What Should You Bake This Weekend?</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@600&family=Inter:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#fff;--ink:#2B231F;--red:#C0392B;--stone:#F7F3EE;--saf:#EAE4DC;--line:rgba(43,35,31,.16);--mut:#675C55;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1c1714;--ink:#F4EEE8;--red:#E0574A;--stone:#26201C;--saf:#332B26;--line:rgba(244,238,232,.18);--mut:#B5A9A0}}
:root[data-theme="dark"]{--bg:#1c1714;--ink:#F4EEE8;--red:#E0574A;--stone:#26201C;--saf:#332B26;--line:rgba(244,238,232,.18);--mut:#B5A9A0}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:400 15px/1.6 Inter,system-ui,sans-serif}
.w{max-width:560px;margin:0 auto;padding:24px 20px 48px}
.card{background:var(--saf);border-radius:26px;padding:32px 26px}
.eb{font-size:10px;font-weight:600;letter-spacing:2px;text-transform:uppercase;color:var(--red)}
h1,h2{font:600 28px/1.15 Fraunces,Georgia,serif;letter-spacing:-.6px;margin:8px 0 14px}
h2{font-size:24px}
.bar{height:4px;background:var(--line);border-radius:2px;margin:0 0 22px}.bar i{display:block;height:100%;background:var(--red);border-radius:2px;transition:width .3s}
.o{display:block;width:100%;text-align:left;background:var(--bg);color:var(--ink);border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin:0 0 10px;font:inherit;cursor:pointer}
.o:hover{border-color:var(--red)}
.o:focus-visible,.b:focus-visible{outline:2px solid var(--red);outline-offset:2px}
.b{background:var(--ink);color:var(--bg);border:0;border-radius:10px;padding:12px 20px;font:600 13px Inter,sans-serif;cursor:pointer;margin-right:8px}
.em{font-size:56px;line-height:1}.tag{color:var(--mut)}
.cook{background:var(--bg);border-radius:14px;padding:14px 16px;margin:16px 0}
</style></head><body><div class="w"><p style="margin:0 0 14px"><a href="../index.html#quiz" style="color:var(--red);text-decoration:none;font-weight:600;font-size:13px">&larr; Cook With What You Have</a></p><div class="card" id="c"></div></div>
<script>
const P={
cookies:{e:"🍪",n:"Chocolate Chip Cookies",d:"You want a quick, happy win. Cookies are forgiving, ready in under an hour, and every batch makes someone’s day.",c:"Chill the dough overnight for deeper flavour, and sprinkle flaky salt on top"},
bread:{e:"🍞",n:"Sourdough Loaf",d:"You’re in no rush and you like the process. A slow, hands-on bake suits a weekend with nowhere to be.",c:"Start the dough on Friday night and bake on Saturday morning"},
brownies:{e:"🍫",n:"Fudgy Brownies",d:"You want maximum reward for minimum fuss. One bowl, one tin and a gooey centre that never disappoints.",c:"Take them out while the middle still looks slightly underdone"},
cinnamon:{e:"🌀",n:"Cinnamon Rolls",d:"You’re baking for a cosy, lazy brunch. Soft dough, warm spice and an icing-covered reward for patience.",c:"Prep them the night before and let them rise slowly in the fridge"},
cake:{e:"🎂",n:"Layer Cake",d:"You’re ready to show off. Layers, frosting and a proper centrepiece to bring to the table.",c:"Bake the sponges a day ahead and assemble on the day"},
pie:{e:"🥧",n:"Apple Pie",d:"You like classic, comforting and made from scratch. Pie is a weekend project that rewards care.",c:"Serve warm with custard or a scoop of vanilla ice cream"},
banana:{e:"🍌",n:"Banana Bread",d:"You’d rather use what’s already in the kitchen. Those spotted bananas are asking to be baked.",c:"Add walnuts or chocolate chips, and slice it thick with butter"},
scones:{e:"🫖",n:"Scones",d:"You’re inviting people round. Light, quick and made for jam, cream and a pot of tea.",c:"Keep the butter cold and don’t twist the cutter"}};
const Q=[
{q:"How much time do you have this weekend?",a:[["About an hour, tops","cookies","scones"],["A relaxed afternoon","brownies","banana"],["Plenty. I want a project","bread","pie"],["All day, and I’m happy to plan ahead","cake","cinnamon"]]},
{q:"What’s the occasion?",a:[["Just me, a craving and a free evening","cookies","brownies"],["Friends coming round for tea","scones","banana"],["A birthday or celebration","cake","brownies"],["A slow, cosy Sunday at home","cinnamon","pie"]]},
{q:"Which flavour pulls you in?",a:[["Rich, dark chocolate","brownies","cake"],["Warm cinnamon and spice","cinnamon","pie"],["Buttery and lightly sweet","scones","cookies"],["Toasty, tangy and savoury-sweet","bread","banana"]]},
{q:"What’s your baking confidence?",a:[["I’m a beginner. Keep it simple","cookies","banana"],["I can follow a recipe well","brownies","scones"],["I’m comfortable with dough","cinnamon","bread"],["Bring on the technical challenge","cake","pie"]]},
{q:"What’s already in your kitchen?",a:[["Butter, sugar, flour and chocolate","cookies","brownies"],["Overripe bananas on the counter","banana","scones"],["Apples and a bag of flour","pie","cinnamon"],["A jar of starter or a bag of strong flour","bread","cinnamon"]]},
{q:"How do you want it to feel?",a:[["Quick and low effort","banana","cookies"],["Impressive and photo-ready","cake","pie"],["Meditative and hands-on","bread","cinnamon"],["Classic and comforting","scones","brownies"]]},
{q:"Who gets a slice?",a:[["Just me, and maybe one friend","cookies","banana"],["The whole family","pie","cinnamon"],["A crowd at a party","cake","brownies"],["A few guests with a cuppa","scones","bread"]]}];
let i=0,s={};const c=document.getElementById("c");
function show(){
 if(i>=Q.length)return res();
 const q=Q[i];
 c.innerHTML=`<div class="eb">Question ${i+1} of ${Q.length}</div><div class="bar"><i style="width:${i/Q.length*100}%"></i></div><h2>${q.q}</h2>`;
 q.a.forEach(a=>{const b=document.createElement("button");b.className="o";b.textContent=a[0];b.onclick=()=>{s[a[1]]=(s[a[1]]||0)+2;s[a[2]]=(s[a[2]]||0)+1;i++;show()};c.appendChild(b)})}
function res(){
 const k=Object.keys(s).sort((a,b)=>s[b]-s[a])[0],p=P[k];
 c.innerHTML=`<div class="eb">This weekend, bake</div><div class="em">${p.e}</div><h1>${p.n}</h1><p>${p.d}</p><div class="cook"><div class="eb">Baker’s tip</div>${p.c}</div><button class="b" id="r">Retake quiz</button>`;
 document.getElementById("r").onclick=()=>{i=0;s={};show()}}
function start(){c.innerHTML=`<div class="eb">A little kitchen fun</div><h1>What should you bake this weekend?</h1><p class="tag">Seven quick questions. One bake. No wrong answers.</p><button class="b" id="s">Start</button>`;document.getElementById("s").onclick=show}
start();
</script></body></html>
