<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Which Spice Are You?</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@600&family=Inter:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#fff;--ink:#2B231F;--red:#C0392B;--stone:#F7F3EE;--saf:#EAE4DC;--line:rgba(43,35,31,.16);--mut:#675C55;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1c1714;--ink:#F4EEE8;--red:#E0574A;--stone:#26201C;--saf:#332B26;--line:rgba(244,238,232,.18);--mut:#B5A9A0}}
:root[data-theme="dark"]{--bg:#1c1714;--ink:#F4EEE8;--red:#E0574A;--stone:#26201C;--saf:#332B26;--line:rgba(244,238,232,.18);--mut:#B5A9A0}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:400 15px/1.6 Inter,system-ui,sans-serif}
.w{max-width:560px;margin:0 auto;padding:24px 20px 48px}
.card{background:var(--saf);border-radius:26px;padding:32px 26px}
.eb{font-size:10px;font-weight:600;letter-spacing:2px;text-transform:uppercase;color:var(--red)}
h1,h2{font:600 28px/1.15 Fraunces,Georgia,serif;letter-spacing:-.6px;margin:8px 0 14px}
.bar{height:4px;background:var(--line);border-radius:2px;margin:0 0 22px}.bar i{display:block;height:100%;background:var(--red);border-radius:2px;transition:width .3s}
.o{display:block;width:100%;text-align:left;background:var(--bg);color:var(--ink);border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin:0 0 10px;font:inherit;cursor:pointer}
.o:hover{border-color:var(--red)}
.b{background:var(--ink);color:var(--bg);border:0;border-radius:10px;padding:12px 20px;font:600 13px Inter,sans-serif;cursor:pointer;margin-right:8px}
.b.g{background:none;color:var(--ink);border:1px solid var(--ink)}
.em{font-size:56px;line-height:1}.tag{color:var(--mut)}
.cook{background:var(--bg);border-radius:14px;padding:14px 16px;margin:16px 0}
</style></head><body><div class="w"><p style="margin:0 0 14px"><a href="../index.html#quiz" style="color:var(--red);text-decoration:none;font-weight:600;font-size:13px">&larr; Cook With What You Have</a></p><div class="card" id="c"></div></div>
<script>
const P={
haldi:{e:"🌼",n:"Haldi",d:"Warm, caring and quietly healing. You’re the friend people call when life gets heavy, and you make everything around you glow.",c:"Pairs beautifully with daal, haldi doodh and anything that needs a little golden love"},
chilli:{e:"🌶️",n:"Lal Mirch",d:"Bold, fiery and impossible to ignore. You say what you feel, you bring the energy, and nobody leaves the room unchanged.",c:"Pairs beautifully with karahi, nihari and spicy achaar"},
zeera:{e:"🌿",n:"Zeera",d:"Dependable, grounded and the secret foundation of everything good. You’re the first thing in the pan, and the reason it all works.",c:"Pairs beautifully with tarka daal, raita and jeera rice"},
elaichi:{e:"✨",n:"Elaichi",d:"Elegant, graceful and a little bit magical. You never shout, yet people remember you long after you leave.",c:"Pairs beautifully with chai, kheer and shahi tukray"},
kalimirch:{e:"⚫",n:"Kali Mirch",d:"Sharp, witty and always straight to the point. You cut through the noise and make every conversation more interesting.",c:"Pairs beautifully with eggs, soups and chicken karahi"},
dalchini:{e:"🍂",n:"Dalchini",d:"Sweet, cosy and comforting. You’re autumn evenings and warm hugs, and people feel at home around you.",c:"Pairs beautifully with pulao, kahwa and baked apples"},
garam:{e:"🎉",n:"Garam Masala",d:"The life of the party, a blend of everyone’s best bits. You bring people together and make any gathering feel like a celebration.",c:"Pairs beautifully with biryani, keema and a big family dinner"},
hing:{e:"💎",n:"Hing",d:"Small but mighty, a little mysterious. You don’t need much to change a whole dish, and people can’t quite name what makes you special.",c:"Pairs beautifully with daal, kadhi and aloo ki sabzi"}};
const Q=[
{q:"How would your friends describe you?",a:[["The caring one who always checks in","haldi","dalchini"],["The bold one who says what everyone’s thinking","chilli","kalimirch"],["The dependable one who’s always there","zeera","haldi"],["The classy one with impeccable taste","elaichi","garam"]]},
{q:"What does your ideal Saturday look like?",a:[["A big gathering with everyone I love","garam","chilli"],["A quiet morning with a book and chai","elaichi","dalchini"],["Trying a hidden place nobody’s heard of","hing","kalimirch"],["Helping a friend finish a project","zeera","haldi"]]},
{q:"You walk into a big family gathering full of relatives. What do you do?",a:[["Head up, big entrance. Everyone notices.","chilli","garam"],["Slip in quietly, but everyone remembers I came","hing","elaichi"],["Greet every single aunty and uncle warmly","dalchini","haldi"],["Scan the room first, then drop a sharp one-liner","kalimirch","zeera"]]},
{q:"What’s your role in the group chat?",a:[["The one who starts the plan","garam","zeera"],["The one sending memes and roasts","kalimirch","chilli"],["The one checking everyone got home safe","haldi","dalchini"],["Rarely texts, but it’s gold when I do","hing","elaichi"]]},
{q:"Pick your comfort drink.",a:[["Masala chai, strong and sweet","garam","zeera"],["Haldi doodh before bed","haldi","hing"],["Kahwa with a cinnamon stick","dalchini","elaichi"],["Black coffee, no sugar","kalimirch","chilli"]]},
{q:"When things get stressful, you…",a:[["Stay steady and keep things moving","zeera","haldi"],["Turn up the heat and take charge","chilli","kalimirch"],["Quietly fix it behind the scenes","hing","elaichi"],["Rally everyone together","garam","dalchini"]]},
{q:"What’s your superpower?",a:[["Making people feel better","haldi","dalchini"],["Making something ordinary unforgettable","hing","elaichi"],["Making sure nobody’s ever bored","garam","chilli"],["Cutting through the nonsense","kalimirch","zeera"]]}];
let i=0,s={};const c=document.getElementById("c");
function show(){
 if(i>=Q.length)return res();
 const q=Q[i];
 c.innerHTML=`<div class="eb">Question ${i+1} of ${Q.length}</div><div class="bar"><i style="width:${i/Q.length*100}%"></i></div><h2>${q.q}</h2>`;
 q.a.forEach(a=>{const b=document.createElement("button");b.className="o";b.textContent=a[0];b.onclick=()=>{s[a[1]]=(s[a[1]]||0)+2;s[a[2]]=(s[a[2]]||0)+1;i++;show()};c.appendChild(b)})}
function res(){
 const k=Object.keys(s).sort((a,b)=>s[b]-s[a])[0],p=P[k];
 c.innerHTML=`<div class="eb">You are</div><div class="em">${p.e}</div><h1>${p.n}</h1><p>${p.d}</p><div class="cook"><div class="eb">Your kitchen matches</div>${p.c}</div><button class="b" id="r">Retake quiz</button>`;
 document.getElementById("r").onclick=()=>{i=0;s={};show()}}
function start(){c.innerHTML=`<div class="eb">A little kitchen fun</div><h1>Which spice are you?</h1><p class="tag">Seven quick questions. One spice. No wrong answers.</p><button class="b" id="s">Start</button>`;document.getElementById("s").onclick=show}
start();
</script></body></html>
