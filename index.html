/* Kitchen personality quiz */
.qz{max-width:560px;margin:0 auto;padding-bottom:12px}
.qz-top{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:6px}
.qz-back{width:44px;height:44px;padding:0;border-radius:50%;border:1px solid var(--line);background:var(--stone);display:grid;place-items:center;cursor:pointer}
.qz-back svg{width:20px;height:20px;stroke:var(--ink);fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.qz-cnt{font-size:13px;font-weight:700;color:var(--mut)}
.qz-bar{display:flex;gap:6px;margin:14px 0 22px}.qz-bar i{flex:1;height:6px;border-radius:3px;background:#EAE4DC}.qz-bar i.on{background:var(--red)}
.qz-hand{font:600 24px/1 Caveat,"Bradley Hand","Segoe Print",cursive;color:var(--red)}
.qz-q{font:600 clamp(26px,6.4vw,34px)/1.12 'Fraunces',Georgia,serif;letter-spacing:-.8px;margin:6px 0 18px}
.qz-opt{display:flex;align-items:center;gap:14px;width:100%;text-align:left;min-height:64px;padding:12px 16px;margin:0 0 10px;border-radius:16px;border:2px solid var(--line);background:#fff;font:600 15.5px/1.35 'Inter',system-ui,sans-serif;color:var(--ink);cursor:pointer}
.qz-opt b{flex:none;width:28px;height:28px;border-radius:50%;border:2px solid rgba(43,35,31,.3);display:grid;place-items:center;font:700 13px 'Inter',sans-serif}
.qz-opt.on{border-color:var(--red);background:#FBEDEB}.qz-opt.on b{background:var(--red);border-color:var(--red);color:#fff}
.qz-cta{display:flex;align-items:center;justify-content:center;width:100%;min-height:56px;margin-top:10px;border:0;border-radius:14px;background:var(--red);color:#fff;font:700 16px 'Inter',system-ui,sans-serif;cursor:pointer;text-decoration:none}
.qz-cta.dark{background:var(--ink)}.qz-cta.ghost{background:#fff;color:var(--ink);border:2px solid var(--ink)}
.qz-cta[disabled]{opacity:.35;cursor:not-allowed}
.qz-pair{display:flex;gap:10px}.qz-pair .qz-cta{flex:1;font-size:14px;min-height:50px}
.qz-intro{text-align:center;display:flex;flex-direction:column;align-items:center;gap:12px;padding-top:6px}
.qz-pot{position:relative;width:250px;height:250px;border-radius:50%;background:#EAE4DC;border:2px dashed rgba(43,35,31,.2);display:grid;place-items:center}
.qz-badge{position:absolute;right:-8px;top:18px;font:600 24px/1 Caveat,"Bradley Hand","Segoe Print",cursive;background:#fff;border:1.5px dashed var(--red);border-radius:8px;padding:2px 12px;transform:rotate(5deg)}
.qz-h{font:600 clamp(30px,8vw,38px)/1.08 'Fraunces',Georgia,serif;letter-spacing:-1px;margin:6px 0 0}
.qz-p{font-size:15px;line-height:1.6;color:var(--mut);margin:0}
.qz-s{font-size:13px;color:var(--mut);text-align:center;margin:6px 0 0}
.qz-res{background:#EAE4DC;border-radius:26px;padding:22px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:8px;margin:16px 0}
.qz-rn{font:700 clamp(32px,9vw,40px)/1.05 'Fraunces',Georgia,serif;letter-spacing:-1.2px;margin:0}
.qz-chips{display:flex;flex-wrap:wrap;justify-content:center;gap:8px}
.qz-chips span{font:600 21px/1 Caveat,"Bradley Hand","Segoe Print",cursive;background:#fff;border:1.5px dashed var(--red);border-radius:8px;padding:2px 11px}
.qz-dish{border:1px solid var(--line);border-left:5px solid var(--red);border-radius:14px;background:var(--stone);padding:14px 16px;margin:16px 0 6px;display:flex;flex-direction:column;gap:4px}
.qz-dish small{font-size:11px;font-weight:700;letter-spacing:1.4px;text-transform:uppercase;color:var(--mut)}
.qz-dish b{font:600 22px 'Fraunces',Georgia,serif;letter-spacing:-.4px}.qz-dish b span{font:500 13px 'Inter',sans-serif;color:var(--mut)}
.qz-dish em{font-style:normal;font-size:13px;color:var(--mut);line-height:1.5}
.qz-all{margin-top:30px}.qz-all h3{font:600 22px 'Fraunces',Georgia,serif;letter-spacing:-.4px;margin:0 0 12px}
.qz-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.qz-c{border-radius:18px;padding:16px;min-height:170px;display:flex;flex-direction:column;gap:8px}
.qz-c b{font:700 19px/1.1 'Fraunces',Georgia,serif;letter-spacing:-.4px}.qz-c span{font-size:13px;line-height:1.45;flex:1}.qz-c em{font-style:normal;font-size:11px;font-weight:700;letter-spacing:1.1px;text-transform:uppercase}
.qz-c-boss{background:#C0392B;color:#fff}.qz-c-genius{background:#2B231F;color:#fff}.qz-c-prep{background:#EAE4DC;color:var(--ink)}.qz-c-comfort{background:#F7F3EE;border:1px solid rgba(43,35,31,.2);color:var(--ink)}.qz-c-fusion{background:#fff;border:2px solid var(--ink);color:var(--ink)}.qz-c-sweet{background:#F6DEDA;color:var(--ink)}
.qz-c-comfort em,.qz-c-fusion em{color:#C0392B}.qz-c-sweet em{color:#A8301F}
.qq{margin:22px 0 6px;padding:16px 18px;border:1.5px dashed rgba(43,35,31,.3);border-radius:14px;background:var(--stone);display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.qq span{display:block;font:600 17px 'Fraunces',Georgia,serif}.qq small{display:block;font-size:14px;color:var(--mut)}
#qnudge{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);width:calc(100% - 32px);max-width:420px;z-index:11;background:var(--stone);border:1px solid var(--line);border-radius:18px;box-shadow:0 12px 30px rgba(43,35,31,.22);padding:16px 18px;display:flex;flex-direction:column;gap:8px;animation:toastIn .3s cubic-bezier(.2,1.4,.4,1)}
#qnudge .qh{font:600 26px/1 Caveat,"Bradley Hand","Segoe Print",cursive;color:var(--red)}
#qnudge .qb{font:600 18px/1.3 'Fraunces',Georgia,serif}
#qnudge .qr{display:flex;gap:10px;align-items:center;margin-top:4px}
#qnudge .qr .qz-cta{margin:0;flex:1;min-height:48px;font-size:14px}
.qz-x{background:none;border:0;color:var(--mut);text-decoration:underline;font:600 14px 'Inter',system-ui,sans-serif;cursor:pointer;padding:10px 6px}
.flinks button.on{color:var(--red)}
@media print{#qnudge{display:none!important}}
</style>

const FAQ={en:[["How does this website work?", "Tick the ingredients you have at home and the site shows dishes you can cook with them. If nothing matches fully, it shows the 5 closest dishes and what you are missing."], ["Do I need to tick salt, oil and spices?", "No. Basics like salt, oil, haldi, red chilli, cumin, garam masala, ginger-garlic, vinegar, chilli sauce and ketchup are assumed."], ["Why are no dishes shown when I open the site?", "Dishes appear when you tick an ingredient, pick a category or search. This keeps the page short and quick."], ["Are these full recipes?", "No. They are short guides with no exact amounts, because every kitchen cooks differently. Cook it your way and adjust to taste."], ["Which cuisines are included?", "Pakistani favourites, plus Chinese, Italian and Continental dishes. Chinese, Italian and Continental dishes sit inside Lunch & Dinner, and their card shows a tag such as Chinese."], ["What does Missing mean?", "These are ingredients a dish needs that you have not ticked. Where we have one, we also suggest a swap."], ["What does Quick mean?", "Dishes that take about 20 minutes or less. Times are approximate."], ["How does Plan your week work?", "Choose a dish for each day, or let the site choose. For days you are not cooking, pick Leftovers, Empty day or Order from outside. You also get a shopping list of what you still need."], ["How do I print my weekly plan?", "On the Plan page, press Print / save as PDF. Open the website in your browser (Chrome or Safari), not inside another app. On iPhone, tap Print, pinch outwards on the preview, then tap Share and Save to Files."], ["Is my plan saved?", "Yes, but only in your own browser on that phone or computer. Clearing browser data, or using another device, starts a new plan. There are no accounts."], ["Can I use the site in Roman Urdu?", "Yes. Tap Roman Urdu at the top to change the menus and buttons. Dish names and recipes are the same in both."], ["What is the Quiz?", "A short, fun quiz that tells you your kitchen personality and suggests a dish to cook. Your answers are not saved or sent anywhere. You can share your result on WhatsApp as a link or an image."]],ru:[["Yeh website kaise kaam karti hai?", "Ghar mein jo cheezein hain unhein chunein, aur website wo dishes dikhati hai jo un se ban sakti hain. Agar koi dish poori match na kare, to 5 qareebi dishes dikhati hai aur batati hai kya kam hai."], ["Kya namak, tel aur masale chunna zaroori hai?", "Nahi. Namak, tel, haldi, lal mirch, zeera, garam masala, adrak lehsan, sirka, chilli sauce aur ketchup jaisi bunyadi cheezein maan li gayi hain."], ["Website kholne par koi dish kyun nahi dikhti?", "Dishes tab nazar aati hain jab aap koi cheez chunte hain, category chunte hain ya search karte hain. Is se page chhota aur tez rehta hai."], ["Kya yeh poori recipes hain?", "Nahi. Yeh mukhtasar guide hain, aur is mein sahi miqdar nahi di gayi, kyunke har ghar ka andaz alag hota hai. Apne andaz se pakayein aur zaiqa dekh kar adjust karein."], ["Kaun se khane shaamil hain?", "Pakistani pasandida khane, aur saath Chinese, Italian aur Continental dishes. Chinese, Italian aur Continental dishes Lunch aur Dinner mein hain, aur un ke card par Chinese jaisa tag hota hai."], ["Missing ka kya matlab hai?", "Yeh wo cheezein hain jo dish ko chahiye lekin aap ne nahi chuni. Jahan hamare paas hota hai, wahan badal ka mashwara bhi diya jata hai."], ["Quick ka kya matlab hai?", "Wo dishes jin mein taqreeban 20 minute ya kam lagte hain. Waqt andaze se hain."], ["Hafte ka menu kaise kaam karta hai?", "Har din ke liye dish chunein, ya website ko chunne dein. Jin dinon pakana nahi, un ke liye Bacha hua khana, Khaali din ya Bahar se mangwayein chunein. Aap ko baqi cheezon ki shopping list bhi milti hai."], ["Hafte ka plan print kaise karun?", "Plan page par Print / PDF save karein dabayein. Website ko apne browser (Chrome ya Safari) mein kholein, kisi aur app ke andar nahi. iPhone par Print dabayein, preview ko ungliyon se bada karein, phir Share aur Save to Files dabayein."], ["Kya mera plan save rehta hai?", "Haan, lekin sirf usi phone ya computer ke browser mein. Browser ka data saaf karne ya doosra device istemal karne par naya plan shuru hoga. Koi account nahi hota."], ["Kya main Roman Urdu mein istemal kar sakta hoon?", "Haan. Upar Roman Urdu dabayein, menu aur buttons badal jayenge. Dishes ke naam aur recipes dono mein ek jaise hain."], ["Quiz kya hai?", "Ek chhota aur dilchasp quiz jo aap ki kitchen personality batata hai aur pakane ke liye ek dish suggest karta hai. Aap ke jawab save ya kahin bheje nahi jate. Aap apna nateeja WhatsApp par link ya tasveer ki soorat mein bhej sakti hain."]]};
const PRIV={en:[["Privacy", "This website does not ask for your name, email or any account. Your weekly plan and any saved choices stay only in your own browser on your own device and are not sent to me or anyone else. If you clear your browser data, they are gone. We may count visits with a simple counter that does not identify you. When you press a WhatsApp button, the text is shared only through WhatsApp, by you, and WhatsApp’s own privacy rules apply. The Feedback button opens a Google Form. Anything you type there goes to Google Forms and to me, and Google’s privacy policy applies to it. The fonts on this site (Fraunces, Inter and Caveat) are loaded from Google Fonts, so your browser contacts Google to fetch them. Please do not put personal details such as your full name, phone number, address or health information in the form. This site is not meant for children under 13 to submit information."], ["Disclaimer", "Recipes here are short guides, not full recipes. Amounts, timings and swaps are approximate. Cooking carries real risks. You cook at your own risk, and you are responsible for checking that food is cooked through, stored safely and safe to eat, especially with raw meat, poultry, eggs, rice, hot oil and sharp tools. This website does not list or check allergens, so if you or anyone you cook for has an allergy or a medical dietary need, read every ingredient label and check each dish yourself. Nothing here is medical, nutritional or dietary advice. Dishes are matched to the ingredients you tick, so the results are suggestions and may not suit your needs."], ["Limitation of liability", "This website is a personal project made by an individual and is provided “as is”, free of charge, with no promise that it is accurate, complete, always available or free of errors. To the fullest extent allowed by law, I am not responsible for any illness, injury, loss or damage that results from using this website or following its suggestions. Nothing here limits any righ
